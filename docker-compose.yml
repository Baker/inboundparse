version: '3.8'

services:
  inboundparse:
    build: .
    ports:
      - "25:25"
      - "587:587"
      - "9090:9090"
    environment:
      - METRICS_ADDR=0.0.0.0:9090
      - ENABLE_METRICS=true
      - VERBOSE=true
    env_file:
      - .env

    networks:
      - monitoring
    volumes:
      - certs:/cert

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./_data/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./_data/grafana/provisioning:/etc/grafana/provisioning
      - ./_data/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring



volumes:
  prometheus_data:
  grafana_data:
  certs:

networks:
  monitoring:
    driver: bridge