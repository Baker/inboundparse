name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: write-all

jobs:
  lint:
    name: 🧹 golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 🕵️ Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3
          args: --timeout=5m

      - name: 🛡️ Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  deps:
    name: 📦 Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 🔄 Tidy dependencies
        run: go mod tidy

      - name: 📦 Verify dependencies
        run: go mod verify

      - name: 🔍 Check for outdated dependencies
        run: |
          go list -u -m all | grep -v "^inboundparse " | grep -E "\[[^\]]*\]$" || true


  test:
    name: 🧪 Test
    needs:
      - lint
      - deps
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: 🧪 Test
        run: go test -v ./... 
  

  coverage:
    name: 📊 Coverage gate
    needs:
      - lint
      - deps
      - test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: 🧪 Run tests with coverage
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=cover.out ./...

      - name: ✅ Enforce coverage threshold
        uses: vladopajic/go-test-coverage@v2
        continue-on-error: true
        with:
          profile: cover.out
          config: ./.github/.testcoverage.yml


  build:
    name: 🔨 Build matrix
    needs:
      - lint
      - deps
      - test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: 🔨 Build
        shell: bash
        run: |
          go env
          go build -v ./...
