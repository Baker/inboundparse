app = 'inboundparse'
primary_region = 'bos'

[build]

[env]
  WEBHOOK_URL = "https://webhook.site/84801796-8b08-4701-a9ea-d202457acb83"
  ENABLE_SPF = "true"
  ENABLE_DKIM = "true"
  ENABLE_DMARC = "true"
  VERBOSE = "true"

[http_service]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[services]]
  internal_port = 25
  protocol = "tcp"

  [[services.ports]]
    port = 25
