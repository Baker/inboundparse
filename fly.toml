# fly.toml app configuration file generated for inboundparse on 2025-06-27T23:04:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inboundparse'
primary_region = 'bos'

[build]

[env]
  WEBHOOK_URL = "https://webhook.site/"
  VERBOSE = "true"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[services]]
  internal_port = 25
  protocol = "tcp"

  [[services.ports]]
    port = 25

  [[services.ports]]
    port = 587
