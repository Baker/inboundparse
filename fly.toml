# fly.toml app configuration file generated for inboundparse on 2025-06-27T23:04:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inboundparse'
primary_region = 'bos'

[build]

[env]
  VERBOSE = "true"
  ENABLE_DKIM = "true"
  ENABLE_DMARC = "true"
  ENABLE_SPF = "true"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[services]]
  internal_port = 25
  internal_address = "0.0.0.0"
  protocol = "tcp"

  [[services.ports]]
    port = 25
    handlers = ["proxy_proto"]

  [[services.ports]]
    port = 587
    handlers = ["proxy_proto"]

[mounts]
  source = "certs"
  destination = "/cert"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"
