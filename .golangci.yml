version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: false

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - gosec      
    - gocritic   
    - revive     
  settings:
    gocyclo:
      min-complexity: 20
    misspell:
      locale: US
    revive:
      rules:
        - name: unused-parameter
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

